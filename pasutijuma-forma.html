<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasūtījuma forma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <h2 class="mb-4">Pasūtījuma forma</h2>

                        <form id="pasutijumaForm" novalidate>

                            <div class="mb-3">
                                <label for="vards" class="form-label">Vārds, uzvārds</label>
                                <input type="text" class="form-control" id="vards" required>
                            </div>

                            <div class="mb-3">
                                <label for="talrunis" class="form-label">Tālrunis</label>
                                <input type="tel" class="form-control" id="talrunis" required>
                            </div>

                            <div class="mb-3">
                                <label for="epasts" class="form-label">E-pasts</label>
                                <input type="email" class="form-control" id="epasts" required>
                            </div>

                            <div class="mb-3">
                                <label for="datums" class="form-label">Brauciena datums</label>
                                <input type="date" class="form-control" id="datums" required>
                            </div>

                            <div class="mb-3">
                                <label for="laiks" class="form-label">Izbraukšanas laiks</label>
                                <input type="time" class="form-control" id="laiks" required>
                            </div>

                            <div class="mb-3">
                                <label for="pasazieri" class="form-label">Pasažieru skaits</label>
                                <input type="number" class="form-control" id="pasazieri" min="1" required>
                            </div>

                            <div class="mb-3">
                                <label for="izbraukvieta" class="form-label">Izbraukšanas vieta</label>
                                <input type="text" class="form-control" id="izbraukvieta" required>
                            </div>

                            <div class="mb-3">
                                <label for="galamerkis" class="form-label">Galamērķis</label>
                                <input type="text" class="form-control" id="galamerkis" required>
                            </div>

                            <div class="mb-3">
                                <label for="starppieturas" class="form-label">Starppieturas</label>
                                <textarea class="form-control" id="starppieturas" rows="2"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="prasibas" class="form-label">Papildus prasības</label>
                                <textarea class="form-control" id="prasibas" rows="3"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="pasakumaTips" class="form-label">Pasākuma tips</label>
                                <select class="form-select" id="pasakumaTips" required>
                                    <option value="" selected disabled>Izvēlieties...</option>
                                    <option value="pasakums">Pasākuma transports</option>
                                    <option value="lidosta">Transfērs uz lidostu</option>
                                    <option value="cits">Cits (norādīt)</option>
                                </select>
                            </div>

                            <div class="mb-3 d-none" id="citsLauks">
                                <label for="citsTeksts" class="form-label">Norādiet pasākuma tipu</label>
                                <input type="text" class="form-control" id="citsTeksts">
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="cena">
                                <label class="form-check-label" for="cena">Vēlos saņemt cenas piedāvājumu</label>
                            </div>

                            <div class="mb-3">
                                <label for="budzets" class="form-label">Budžets (pēc izvēles)</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="budzets" min="0">
                                    <span class="input-group-text">€</span>
                                </div>
                            </div>

                            <div class="mb-2 form-check">
                                <input type="checkbox" class="form-check-input" id="dati" required>
                                <label class="form-check-label" for="dati">Piekrītu personas datu apstrādei</label>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="noteikumi" required>
                                <label class="form-check-label" for="noteikumi">Piekrītu pakalpojuma noteikumiem</label>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Pasažieru skaita kalkulators</label>
                                <div class="card card-body bg-light">
                                    <div class="row g-2 mb-2">
                                        <div class="col-md-4">
                                            <label for="pieaugusie" class="form-label small">Pieaugušie</label>
                                            <input type="number" class="form-control calc-input" id="pieaugusie" min="0" value="0">
                                        </div>
                                        <div class="col-md-4">
                                            <label for="berni" class="form-label small">Bērni</label>
                                            <input type="number" class="form-control calc-input" id="berni" min="0" value="0">
                                        </div>
                                        <div class="col-md-4">
                                            <label for="seniori" class="form-label small">Seniori</label>
                                            <input type="number" class="form-control calc-input" id="seniori" min="0" value="0">
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                                        <span class="fw-semibold">Kopā pasažieri:</span>
                                        <span class="fs-5 fw-bold" id="kopaSkaits">0</span>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="fails" class="form-label">Faila pievienošana</label>
                                <input type="file" class="form-control" id="fails">
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Iesniegt pieprasījumu</button>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Pasākuma tips - rādīt "Cits" lauku, kad izvēlēts
        document.getElementById('pasakumaTips').addEventListener('change', function() {
            const citsLauks = document.getElementById('citsLauks');
            const citsTeksts = document.getElementById('citsTeksts');
            if (this.value === 'cits') {
                citsLauks.classList.remove('d-none');
                citsTeksts.required = true;
            } else {
                citsLauks.classList.add('d-none');
                citsTeksts.required = false;
            }
        });

        // Pasažieru skaita kalkulators
        document.querySelectorAll('.calc-input').forEach(input => {
            input.addEventListener('input', function() {
                const pieaugusie = parseInt(document.getElementById('pieaugusie').value) || 0;
                const berni = parseInt(document.getElementById('berni').value) || 0;
                const seniori = parseInt(document.getElementById('seniori').value) || 0;
                const kopa = pieaugusie + berni + seniori;
                document.getElementById('kopaSkaits').textContent = kopa;
                document.getElementById('pasazieri').value = kopa;
            });
        });
    </script>

</body>
</html>
